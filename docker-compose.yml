services:
  backend:
    build: .
    env_file:
      - .env
    ports:
      - '127.0.0.1:${APP_PORT}:8000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    user: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
