apiVersion: v1
kind: Service
metadata:
  name: books-api
  namespace: egor-miroevsky
spec:
  type: ClusterIP
  selector:
    app: books-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-api
  namespace: egor-miroevsky
spec:
  replicas: 1
  selector:
    matchLabels:
      app: books-api
  template:
    metadata:
      labels:
        app: books-api
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: public.ecr.aws/docker/library/postgres:16.16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U book_user -d books_db; do
                sleep 2
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: backend
          image: ghcr.io/k0rdun/docker-lab:k8s-1.0.0
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: books_db
            - name: POSTGRES_USER
              value: book_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
